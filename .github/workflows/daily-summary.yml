name: Daily Summary

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed job
        env:
          DAILY_SUMMARY_URL: ${{ secrets.DAILY_SUMMARY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${DAILY_SUMMARY_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::Daily Summary skipped: DAILY_SUMMARY_URL or CRON_SECRET is not configured."
            exit 0
          fi

          curl --fail --show-error --silent \
            --request POST "$DAILY_SUMMARY_URL/api/jobs/daily-summary" \
            --header "Authorization: Bearer $CRON_SECRET"
